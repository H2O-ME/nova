<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="686" viewBox="0 0 1240 686" role="img">
  <title>NovaAgent 单轮运行数据流：浏览器界面帧层、AgentSession 内核循环、工具执行管线三层交汇，会话日志全程落盘</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#99a1ab"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e6f5c"/>
    </marker>
  </defs>
  <rect width="1240" height="686" fill="#ffffff"/>

  <!-- ═ Lane 1 · surface 帧层 ═ -->
  <rect x="24" y="20" width="1192" height="152" rx="12" fill="#f5f8fb" stroke="#d8e3ee"/>
  <text x="44" y="46" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#33608c">surface 帧层（浏览器 UI · 帧进帧出，状态归一处纯 reducer，React 只做投影）</text>
  <text x="1196" y="44" text-anchor="end" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8a919c">其它 surface 同一条流：REPL（读行主循环）· exec 无头（JSONL）· qqbot 通道——渲染归各自壳</text>
  <g font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <rect x="44"   y="78" width="110" height="64" rx="8" fill="#ffffff" stroke="#c9d8ea"/>
    <text x="99"   y="104" text-anchor="middle" font-size="12.5" fill="#1b1d21">浏览器输入</text>
    <text x="99"   y="122" text-anchor="middle" font-size="10.5" fill="#8a919c">client.ts 发帧</text>
    <line x1="154" y1="110" x2="174" y2="110" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="174"  y="78" width="140" height="64" rx="8" fill="#ffffff" stroke="#c9d8ea"/>
    <text x="244"  y="104" text-anchor="middle" font-size="12.5" fill="#1b1d21">server / ws</text>
    <text x="244"  y="122" text-anchor="middle" font-size="10.5" fill="#8a919c">认证门 · RFC6455</text>
    <line x1="314" y1="110" x2="334" y2="110" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="334"  y="78" width="150" height="64" rx="8" fill="#ffffff" stroke="#c9d8ea"/>
    <text x="409"  y="104" text-anchor="middle" font-size="12.5" fill="#1b1d21">protocol 校验</text>
    <text x="409"  y="122" text-anchor="middle" font-size="10.5" fill="#8a919c">帧 schema · fail-closed</text>
    <line x1="484" y1="110" x2="504" y2="110" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="504"  y="78" width="200" height="64" rx="8" fill="#ffffff" stroke="#c9d8ea"/>
    <text x="604"  y="100" text-anchor="middle" font-size="12.5" fill="#1b1d21">controller（中枢）</text>
    <text x="604"  y="118" text-anchor="middle" font-size="10.5" fill="#5f6772">回放 ready 基线 · 事件扇出</text>
    <text x="604" y="134" text-anchor="middle" font-size="10.5" fill="#5f6772">callViewOf 视图 enrich</text>
    <line x1="704" y1="110" x2="724" y2="110" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="724"  y="78" width="170" height="64" rx="8" fill="#ffffff" stroke="#c9d8ea"/>
    <text x="809"  y="104" text-anchor="middle" font-size="12.5" fill="#1b1d21">state.ts 纯 reducer</text>
    <text x="809"  y="122" text-anchor="middle" font-size="10.5" fill="#8a919c">帧入 → UI 块出（可直测）</text>
    <line x1="894" y1="110" x2="914" y2="110" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="914"  y="78" width="160" height="64" rx="8" fill="#ffffff" stroke="#c9d8ea"/>
    <text x="994"  y="100" text-anchor="middle" font-size="12.5" fill="#1b1d21">card-view / format</text>
    <text x="994"  y="118" text-anchor="middle" font-size="10.5" fill="#5f6772">六卡四态纯渲染模型</text>
    <text x="994" y="134" text-anchor="middle" font-size="10.5" fill="#5f6772">唯一格式化处</text>
    <line x1="1074" y1="110" x2="1094" y2="110" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="1094" y="78" width="100" height="64" rx="8" fill="#33608c"/>
    <text x="1144" y="106" text-anchor="middle" font-size="12.5" fill="#ffffff">React 投影</text>
    <text x="1144" y="124" text-anchor="middle" font-size="10.5" fill="#c9d8ea">DOM</text>
  </g>

  <!-- 输入下行：客户端帧 → 内核调用 -->
  <line x1="99" y1="142" x2="99" y2="258" stroke="#99a1ab" marker-end="url(#ar)"/>

  <!-- 事件回流：内核 → surface -->
  <polyline points="286,246 286,188 809,188 809,142" fill="none" stroke="#0e6f5c" stroke-dasharray="5 4" marker-end="url(#arT)"/>
  <text x="470" y="182" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#0e6f5c">KernelEvent 流（流式 delta / 工具活行 / 审批请求 / 队列·压缩·子代理·job · run_stats）</text>

  <!-- ═ Lane 2 · 内核循环 ═ -->
  <rect x="24" y="200" width="1192" height="156" rx="12" fill="#eef6f3" stroke="#bfdcd2"/>
  <text x="44" y="226" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#0e6f5c">内核循环（core/kernel · AgentSession 句柄；能力由插件经服务缝注入）</text>
  <g font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <rect x="44"   y="258" width="110" height="64" rx="8" fill="#ffffff" stroke="#bfdcd2"/>
    <text x="99"   y="284" text-anchor="middle" font-size="12.5" fill="#1b1d21">提交 / 队首</text>
    <text x="99"   y="302" text-anchor="middle" font-size="10.5" fill="#8a919c">agent.prompt()</text>
    <line x1="154" y1="290" x2="174" y2="290" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="176"  y="246" width="220" height="90" rx="8" fill="#ffffff" stroke="#bfdcd2"/>
    <text x="286"  y="270" text-anchor="middle" font-size="12.5" fill="#1b1d21">请求装配 · 轮内预检</text>
    <text x="286"  y="290" text-anchor="middle" font-size="10.5" fill="#5f6772">前缀冻结系统提示 + 工具名字典序</text>
    <text x="286"  y="306" text-anchor="middle" font-size="10.5" fill="#5f6772">会话首条指令片段（append-only）</text>
    <text x="286" y="322" text-anchor="middle" font-size="10.5" fill="#5f6772">job 通知注入 · 压缩预判 · 空补全重试</text>
    <line x1="396" y1="290" x2="416" y2="290" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="418"  y="258" width="128" height="64" rx="8" fill="#ffffff" stroke="#bfdcd2"/>
    <text x="482"  y="284" text-anchor="middle" font-size="12.5" fill="#1b1d21">beforeLlmCall</text>
    <text x="482"  y="302" text-anchor="middle" font-size="10.5" fill="#8a919c">waterfall 钩子链</text>
    <line x1="546" y1="290" x2="566" y2="290" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="568"  y="258" width="210" height="64" rx="8" fill="#ffffff" stroke="#bfdcd2"/>
    <text x="673"  y="280" text-anchor="middle" font-size="12.5" fill="#1b1d21">ai · OpenAICompatClient</text>
    <text x="673"  y="298" text-anchor="middle" font-size="10.5" fill="#5f6772">SSE 流式 · 断流自愈 · 字典序 tools</text>
    <text x="673" y="312" text-anchor="middle" font-size="10.5" fill="#5f6772">prompt_cache_key · 会话亲和头</text>
    <line x1="778" y1="290" x2="798" y2="290" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="800"  y="258" width="110" height="64" rx="8" fill="#0e6f5c"/>
    <text x="855"  y="294" text-anchor="middle" font-size="12.5" fill="#ffffff">provider</text>
    <line x1="910" y1="290" x2="930" y2="290" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="932"  y="258" width="160" height="64" rx="8" fill="#ffffff" stroke="#bfdcd2"/>
    <text x="1012" y="280" text-anchor="middle" font-size="12.5" fill="#1b1d21">assistant 消息</text>
    <text x="1012" y="298" text-anchor="middle" font-size="10.5" fill="#5f6772">文本 → 本轮收尾</text>
    <text x="1012" y="312" text-anchor="middle" font-size="10.5" fill="#5f6772">tool_calls → 工具管线 ↓</text>
  </g>

  <!-- run_stats 时序：先于本轮终结符 -->
  <text x="1216" y="344" text-anchor="end" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#0e6f5c">run_stats 先于 done 发出（终结符是消费者等的最后一帧）</text>

  <!-- ═ Lane 3 · 工具执行 ═ -->
  <rect x="24" y="386" width="1192" height="182" rx="12" fill="#fbf7ef" stroke="#e5d5b5"/>
  <text x="44" y="412" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#a35a06">工具执行（plugins 能力插件 · 与第三方插件同 API、同一审批门）</text>
  <g font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <line x1="1012" y1="322" x2="1012" y2="352" stroke="#99a1ab"/>
    <line x1="1012" y1="352" x2="112" y2="352" stroke="#99a1ab"/>
    <line x1="112"  y1="352" x2="112" y2="440" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="44"   y="440" width="136" height="64" rx="8" fill="#ffffff" stroke="#e5d5b5"/>
    <text x="112"  y="466" text-anchor="middle" font-size="12.5" fill="#1b1d21">beforeToolCall</text>
    <text x="112"  y="484" text-anchor="middle" font-size="10.5" fill="#8a919c">可拦截 / 改写参数</text>
    <line x1="180" y1="472" x2="200" y2="472" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="202"  y="440" width="186" height="64" rx="8" fill="#ffffff" stroke="#e5d5b5"/>
    <text x="295"  y="462" text-anchor="middle" font-size="12.5" fill="#1b1d21">permission 审批门</text>
    <text x="295"  y="480" text-anchor="middle" font-size="10.5" fill="#5f6772">三档 · y/n/a · 授权词数 · 拒绝理由回流</text>
    <text x="295" y="494" text-anchor="middle" font-size="10.5" fill="#5f6772">fail-closed · ask=approval_request 事件</text>
    <line x1="388" y1="472" x2="408" y2="472" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="410"  y="440" width="150" height="64" rx="8" fill="#ffffff" stroke="#e5d5b5"/>
    <text x="485"  y="462" text-anchor="middle" font-size="12.5" fill="#1b1d21">host 分发</text>
    <text x="485"  y="480" text-anchor="middle" font-size="10.5" fill="#5f6772">并发安全整段并行</text>
    <text x="485" y="494" text-anchor="middle" font-size="10.5" fill="#5f6772">结果按序写回</text>
    <line x1="560" y1="472" x2="580" y2="472" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="582"  y="428" width="252" height="118" rx="8" fill="#ffffff" stroke="#e5d5b5"/>
    <g font-size="11.5" fill="#4a525d">
      <text x="598" y="452">内置 fs · bash · search · todo · jobs</text>
      <text x="598" y="474">search_files → worker 线程（防回溯）</text>
      <text x="598" y="496">PTC run_code → worker（四类预算）</text>
      <text x="598" y="518">subagent → 隔离嵌套 run（可后台化）</text>
    </g>
    <line x1="834" y1="472" x2="854" y2="472" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="856"  y="440" width="120" height="64" rx="8" fill="#ffffff" stroke="#e5d5b5"/>
    <text x="916"  y="466" text-anchor="middle" font-size="12.5" fill="#1b1d21">afterToolResult</text>
    <text x="916"  y="484" text-anchor="middle" font-size="10.5" fill="#8a919c">钩子</text>
    <line x1="976" y1="472" x2="996" y2="472" stroke="#99a1ab" marker-end="url(#ar)"/>
    <rect x="998"  y="440" width="198" height="64" rx="8" fill="#ffffff" stroke="#e5d5b5"/>
    <text x="1097" y="462" text-anchor="middle" font-size="12.5" fill="#1b1d21">结果 &gt; 40KB 溢出落盘</text>
    <text x="1097" y="480" text-anchor="middle" font-size="10.5" fill="#5f6772">消息体留头 60% + 尾 40%</text>
    <text x="1097" y="494" text-anchor="middle" font-size="10.5" fill="#5f6772">全文 → cache/tool-outputs</text>
  </g>

  <!-- 下一轮循环箭头 -->
  <line x1="1097" y1="504" x2="1097" y2="582" stroke="#99a1ab" stroke-dasharray="5 4"/>
  <line x1="1097" y1="582" x2="286" y2="582" stroke="#99a1ab" stroke-dasharray="5 4"/>
  <line x1="286" y1="582" x2="286" y2="322" stroke="#99a1ab" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="660" y="576" text-anchor="middle" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8a919c">工具结果入消息面 → 下一轮请求（message 事件 appendEvent 先写盘后入内存）</text>

  <!-- ═ 底座 · 插件容器与落盘 ═ -->
  <rect x="24" y="604" width="1192" height="62" rx="12" fill="#fafbfc" stroke="#dfe3e8"/>
  <text x="44" y="628" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3f4650">一切皆插件：模型 / 工具 / 命令 / 审批 / 会话 / 压缩 / 后台 jobs / 技能 / 呈现 / surfaces 由插件注册进内核的十道服务缝——</text>
  <text x="44" y="650" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#5f6772">配置层 plugins.disable / plugins.extra 即可选择、替换、扩展，源码零改动；/plugins 打印当前 roster（名称 · 状态 · 注入的能力）。会话落盘 ~/.nova/sessions/YYYY/MM/DD/&lt;id&gt;.jsonl，工作区零写入。</text>
</svg>